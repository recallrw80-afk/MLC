# MLC Rust workspace — SDK(mlccore) + CLI(mlc) + GUI(mlc-gui，Reta) + C ABI(mlccore-ffi，可选)
# 计划与硬约束见 ../docs/rust-rewrite-plan.md、../docs/rust-inventory.md
[workspace]
resolver = "2"
members = [
    "crates/mlccore",
    "crates/mlc",
    "crates/mlccore-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/recallrw80-afk/MLC"

# 依赖版本集中在 workspace 管理，各 crate 用 { workspace = true } 引用
[workspace.dependencies]
mlccore = { path = "crates/mlccore" }

# CLI
clap = { version = "=4.6.7", features = ["derive"] }
inquire = "=0.9.4"
dialoguer = "=0.12"
indicatif = "0.18"

# 核心
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
# rustls 而非 OpenSSL：TLS 全用 Rust 实现，不依赖系统 OpenSSL。
# 2026-11-14 升级 reqwest 0.12 → 0.13 后的 feature 变化（用户已确认选型）：
#   - feature 名 "rustls-tls" 已不存在，改名为 "rustls"
#   - 0.13 的 "rustls" 默认走 aws-lc-rs 提供者（需要 cmake + C 编译器，
#     不再是 0.12 时代的 ring）。若日后要回到"无 CMake 依赖"，
#     改用 "rustls-no-provider" + 显式安装 ring provider（需在启动处设 CryptoProvider）。
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
# bytes_stream 的 Stream 扩展
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# forgecdn 回退的主机解析
url = "=2.5.8"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
sha1 = "=0.11.0"
base64 = "0.23.1"
# default-features=false 排除 bzip2-sys（需要 C 工具链）；deflate 走 flate2 纯 Rust 后端
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
encoding_rs = "=0.8.44"
tar = "=0.4.46"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
xz2 = "=0.1.7"
# 密钥派生用（MD5 前 8 原始字节）；DES 块算法按 C++ 原实现逐行移植——它是自洽的
# 非标准位序变体，标准 DES crate（如 des）与其不兼容，故不引入
md-5 = "=0.11.0"
sysinfo = "=0.40.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
dirs = "=7.0.0"
which = "8.0.6"

[workspace.lints.rust]
unsafe_code = "allow" # ffi crate 必须 unsafe；不在 workspace 级禁止

[workspace.lints.clippy]
all = "warn"

# 发布单文件：静态链接、strip、LTO
[profile.release]
lto = true
strip = true
codegen-units = 1
